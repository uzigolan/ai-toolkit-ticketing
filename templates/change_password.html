{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<h1 class="page-title">Change your password</h1>
<p class="page-subtitle">Local accounts only — directory passwords are managed by IT.</p>
<div class="content-card">
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="form-field">
      <label for="current_password">Current password</label>
      <input class="form-control" type="password" id="current_password" name="current_password" autofocus required>
    </div>
    <div class="form-field">
      <label for="new_password">New password</label>
      <span class="form-hint">At least 8 characters.</span>
      <input class="form-control" type="password" id="new_password" name="new_password" minlength="8" required>
    </div>
    <div class="form-field">
      <label for="confirm_password">Confirm new password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
