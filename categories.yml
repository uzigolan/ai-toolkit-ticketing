# Ticket taxonomy for the RAD AI Ticketing Center.
#
# Edit this file to change the toolkits, categories, device families, severities
# and the facets offered on the submit form -- no code change needed. The app
# reads it at startup, so restart after editing. Point TICKETING_CATEGORIES_FILE
# at a different path to use another file.
#
# The `id` values are what get stored in the database and in exported eval
# cases, so keep them stable: renaming an id orphans the tickets already filed
# under it (they still display, just by their raw id). Labels are free to change
# at any time.

# Which AI toolkit the ticket is about. This is the first thing a submitter
# picks, because everything else -- who triages it, which repo the eval case
# lands in -- follows from it. Add a line here when a new toolkit appears; no
# code change and no migration needed. `default: true` is preselected on the
# form; move it to whichever toolkit gets the most tickets.
toolkits:
  - id: rad-agent-toolkit
    label: rad-agent-toolkit
    default: true
  - id: radview-ai-toolkit
    label: radview-ai-toolkit
  - id: pikachu-ai-toolkit
    label: pikachu-ai-toolkit
  - id: synergy-ccm-mcp
    label: synergy-ccm-mcp
  - id: self-hosted-ai-poc
    label: self-hosted-ai-poc
  - id: other
    label: Something else / not listed yet

# What went wrong. Multi-select: a slow answer that also needed three retries
# and still came back wrong is one ticket with three boxes ticked, not three
# tickets.
categories:
  - id: wrong_result
    label: Wrong result
  - id: bad_format
    label: Right, but wrong format
  - id: slow_result
    label: Right, but too slow
  - id: many_retries
    label: Took too many retries

# Device families the report covers. Multi-select -- "this is wrong on ETX and
# SecFlow both" is one ticket.
rad_families:
  - ETX
  - SecFlow
  - Megaplex
  - MiNID
  - ETX-2V
  - n/a

# Whether answering needed RAD-specific knowledge, general market/industry
# knowledge, or both. `default: true` ticks the box on a fresh form -- RAD is
# ticked because it applies to nearly every ticket here.
knowledge_scope:
  - id: rad
    label: RAD knowledge (RAD products, manuals, CLI)
    default: true
  - id: market
    label: Market knowledge (general networking / industry)

# Which reference material the answer should have come from. Tick as many as
# apply -- "the CLI reference disagreed with the manual" is a common shape, and
# it points triage straight at the source that needs fixing.
knowledge_sources:
  - id: manual
    label: User manual
  - id: datasheet
    label: Datasheet
  - id: release_notes
    label: Release notes / TRS
  - id: cli
    label: CLI reference
  - id: mib
    label: MIB / SNMP
  - id: mea
    label: MEA / debug tree
  - id: skills
    label: Agent skills & instructions
  - id: vendor
    label: Vendor docs (Altera / FPGA)
  - id: catalog
    label: Catalog / ordering
  - id: netconf
    label: NETCONF / YANG models

# What the agent was actually doing. Also a combination: a question that ends in
# a config change touches all three, and the risk grows down the list.
operations:
  - id: lookup
    label: Knowledge lookup (no device)
  - id: design
    label: Architecture / design / planning
  - id: device_read
    label: Device read (show / get info)
  - id: device_write
    label: Device change (set / stage / commit)

# Self-hosted POC areas from "Self-Hosted AI POC v1.02". Used only when the
# submitter selects the self-hosted ticketing track on the form.
self_hosted_areas:
  - id: chip_design_ai
    label: Chip-Design AI Applications
  - id: coding_assistance
    label: AI Coding Assistance
  - id: radchat_rag_cli
    label: RADChat / RAG / Local CLI Generation
  - id: sdlc_workflows
    label: SDLC Workflows
  - id: cost_value
    label: Cost and Value Benchmark
  - id: performance
    label: Performance Benchmark
  - id: security
    label: Security Gate
  - id: final_scorecard
    label: Final Scorecard

self_hosted_metrics:
  - id: engineering_quality_score
    label: Engineering Quality Score
  - id: weighted_capability_coverage
    label: Weighted Capability Coverage
  - id: model_tool_efficiency
    label: Model and Tool Efficiency Metrics
  - id: coding_assistance_score
    label: Coding Assistance Score
  - id: sdlc_score
    label: SDLC Score
  - id: cost_comparison
    label: Cost Comparison
  - id: performance_measurement
    label: Performance Measurement
  - id: security_gate_check
    label: Security Gate Check
  - id: final_score
    label: Final Score

self_hosted_results:
  - id: full_pass
    label: Full pass
  - id: pass_minor
    label: Pass with minor correction
  - id: partial
    label: Partial result
  - id: failure
    label: Failure
  - id: critical_failure
    label: Critical or unsafe failure

severities:
  - id: low
    label: Low
  - id: normal
    label: Normal
  - id: high
    label: High — blocking my work

# What an admin can do with a ticket.
#   status:           the state the ticket moves into.
#   requires_version: demands the `rad agent show system versions` output of the build
#                     that carries the fix.
#   requires_note:    demands an explanation.
resolutions:
  - id: solved
    label: Solved
    status: solved
    requires_version: true
  - id: in_verification
    label: In verification
    status: in_verification
  - id: known_limitation
    label: Known limitation
    status: known_limitation
    requires_note: true
  - id: working_on_it
    label: Working on it
    status: working_on_it
    requires_note: true
